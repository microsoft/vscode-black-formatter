name: Publish Release
trigger:
  branches:
    include:
      - 'release/*'
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/pylance-eng
      ref: refs/heads/main
      endpoint: Github-Pylance
    - repository: translations
      type: github
      name: microsoft/vscode-python-extensions-loc
      # Temporarily use dev while the localization force-push issue is resolved.
      ref: refs/heads/dev
      endpoint: Github-Pylance
    - repository: localizationTools
      type: github
      name: microsoft/vscode-python-ci
      ref: f078b68e968b56e0a22d6cf803bb241a6b094994
      endpoint: Github-Pylance
variables:
  - name: TeamName
    value: VSCode-black-formatter
  - name: VsixName
    value: black-formatter.vsix
  - name: NodeVersion
    value: '22.17.0'
  - name: PythonVersion
    value: '3.10'
  - name: NPM_CONFIG_REGISTRY
    value: 'https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/'
  - name: PIP_PROXY_INDEX_URL
    # PipAuthenticate supplies the internal index URL with credentials before buildSteps.
    value: '$(PIP_INDEX_URL)'

parameters:
  - name: publishExtension
    displayName: 🚀 Publish Extension
    type: boolean
    default: true

  - name: buildSteps
    type: stepList
    default:
      - script: git submodule update --init --recursive
        displayName: Checkout submodules
      - script: npm run ci:msft
        displayName: Install NPM dependencies

      - script: python -m pip install -U pip
        displayName: Upgrade pip
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install wheel
        displayName: Install wheel
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install nox
        displayName: Install nox
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m nox --session install_bundled_libs
        displayName: Install Python dependencies
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python ./build/update_ext_version.py --release --for-publishing
        displayName: Update build number

      - script: npm run package
        displayName: Build extension

extends:
  template: azure-pipelines/extension/stable.yml@templates
  parameters:
    buildSteps: ${{ parameters.buildSteps }}
    standardizedVersioning: true
    customNPMRegistry: $(NPM_CONFIG_REGISTRY)
    publishExtension: ${{ parameters.publishExtension }}
    teamName: $(TeamName)
    ghCreateTag: true
    ghCreateRelease: true
    ghReleaseAddChangeLog: true
    validationNotifyUsers: plseng@microsoft.com
    sourceAnalysisPool: VSEng-MicroBuildVSStable
    pullLocalization: true
