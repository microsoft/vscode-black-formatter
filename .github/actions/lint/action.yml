name: 'Lint'
description: 'Lint TypeScript and Python code'

inputs:
  node_version:
    description: 'Version of Node to install'
    required: true
  python_version:
    description: 'Version of Python to install'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Node
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci
      shell: bash

    - name: Lint TypeScript code
      run: npm run lint
      shell: bash

    - name: Check TypeScript format
      run: npm run format-check
      shell: bash

    - name: Install Python ${{ inputs.python_version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Pip cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Upgrade Pip
      run: python -m pip install -U pip
      shell: bash

    - name: Install wheel and nox
      run: python -m pip install wheel nox
      shell: bash

    # This will install libraries to a target directory.
    - name: Install bundled python libraries
      run: python -m nox --session install_bundled_libs
      shell: bash

    - name: Check linting and formatting
      run: python -m nox --session lint
      shell: bash
