name: 'Authenticate package feeds'
description: 'Authenticate to Pylance_PublicPackages using GitHub OIDC'

runs:
  using: 'composite'
  steps:
    - name: Azure OIDC login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: 92c669e8-02ad-4ce6-ad73-f222fc7177e2
        tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
        allow-no-subscriptions: true

    - name: Configure authenticated npm and pip feeds
      shell: bash
      run: |
        token="$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken --output tsv | tr -d '\r')"
        NODE_AUTH_TOKEN="$token" node "$GITHUB_ACTION_PATH/../../../build/setup-github-feeds.js"
