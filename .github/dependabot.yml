version: 2

registries:
  pylance-public-packages:
    type: npm-registry
    url: https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/
    tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
    client-id: 92c669e8-02ad-4ce6-ad73-f222fc7177e2
    replaces-base: true

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'

updates:
  # NPM, Python, and GitHub Actions dependencies are updated together.
  - package-ecosystem: 'npm'
    registries:
      - 'pylance-public-packages'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
      - dependency-name: 'vscode-languageclient'

  - package-ecosystem: 'pip'
    labels:
      - 'dependencies'
      - 'debt'
    directories:
      - '/'
      - '/src/test/python_tests'
    # Multi-ecosystem groups only support positive patterns. Keep Black
    # unmatched so its updates remain standalone.
    patterns:
      - 'attrs'
      - 'cattrs'
      - 'click'
      - 'colorama'
      - 'exceptiongroup'
      - 'iniconfig'
      - 'lsprotocol'
      - 'mypy-extensions'
      - 'packaging'
      - 'pathspec'
      - 'platformdirs'
      - 'pluggy'
      - 'pygls'
      - 'pygments'
      - 'pyhamcrest'
      - 'pytest'
      - 'python-jsonrpc-server'
      - 'pytokens'
      - 'tomli'
      - 'typing-extensions'
      - 'ujson'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      default-days: 7

  # The shared package submodule is updated daily in a standalone PR.
  - package-ecosystem: 'gitsubmodule'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    allow:
      - dependency-name: 'external/vscode-common-python-lsp'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
