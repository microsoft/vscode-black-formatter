version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: 'weekly'
    exclude-patterns:
      - 'black'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'

updates:
  # NPM, Python, and GitHub Actions dependencies are updated together.
  - package-ecosystem: 'npm'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
      - dependency-name: 'vscode-languageclient'

  - package-ecosystem: 'pip'
    labels:
      - 'dependencies'
      - 'debt'
    directories:
      - '/'
      - '/src/test/python_tests'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  # The shared package submodule is updated daily in a standalone PR.
  - package-ecosystem: 'gitsubmodule'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    allow:
      - dependency-name: 'external/vscode-common-python-lsp'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
    open-pull-requests-limit: 10
