name: Localization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package.nls.json
      - src/**/*.ts
      - external/vscode-common-python-lsp
      - .gitmodules
      - .nvmrc
      - .github/workflows/localization.yml

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localization:
    if: github.repository == 'microsoft/vscode-black-formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: microsoft/vscode-common-python-lsp/.github/actions/localization@6b4a3573e7e7a9fe1e468e129544432278aec2d6
        with:
          app-id: ${{ vars.PYTHON_LOCALIZATION_APP_ID }}
          private-key: ${{ secrets.PYTHON_LOCALIZATION_PRIVATE_KEY }}
          submodules: recursive
          source-paths: '["src", "external/vscode-common-python-lsp/typescript/src"]'
          node-version: '24.17.0'
